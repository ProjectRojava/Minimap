<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Minimap</title>
  <style>
    .bg0 { stop-color: #F7F4EC; }
    .bg1 { stop-color: #E6E0D2; }
    .fog { stop-color: #E6E0D2; }
    .grid { stroke: #14263D; stroke-opacity: 0.08; }
    .link { stroke: #1E9E91; }
    .node { fill: #1E9E91; }
    .frame { stroke: #14263D; fill: #14263D; fill-opacity: 0.05; }
    .here { fill: #F29B1F; }
    @media (prefers-color-scheme: dark) {
      .bg0 { stop-color: #16293F; }
      .bg1 { stop-color: #0B1524; }
      .fog { stop-color: #0B1524; }
      .grid { stroke: #FFFFFF; stroke-opacity: 0.07; }
      .link { stroke: #3FC7B8; }
      .node { fill: #3FC7B8; }
      .frame { stroke: #F7F4EC; fill: #FFFFFF; fill-opacity: 0.07; }
      .here { fill: #FFB547; }
    }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" class="bg0"/>
      <stop offset="1" class="bg1"/>
    </linearGradient>
    <radialGradient id="fog" cx="0.5" cy="0.5" r="0.72">
      <stop offset="0.55" class="fog" stop-opacity="0"/>
      <stop offset="1" class="fog" stop-opacity="0.9"/>
    </radialGradient>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <g clip-path="url(#tile)">
    <g class="grid" stroke-width="3">
      <path d="M64 0V512M128 0V512M192 0V512M256 0V512M320 0V512M384 0V512M448 0V512"/>
      <path d="M0 64H512M0 128H512M0 192H512M0 256H512M0 320H512M0 384H512M0 448H512"/>
    </g>
    <g class="link" fill="none" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
      <path d="M112 384 L196 236 L300 300 L400 148"/>
      <path d="M300 300 L392 400"/>
    </g>
    <rect class="frame" x="152" y="196" width="196" height="148" rx="20" stroke-width="12"/>
    <g class="node">
      <circle cx="112" cy="384" r="24"/>
      <circle cx="196" cy="236" r="24"/>
      <circle cx="400" cy="148" r="24"/>
      <circle cx="392" cy="400" r="24"/>
    </g>
    <circle class="here" cx="300" cy="300" r="46" fill-opacity="0.22"/>
    <circle class="here" cx="300" cy="300" r="30"/>
    <rect width="512" height="512" fill="url(#fog)"/>
  </g>
</svg>
