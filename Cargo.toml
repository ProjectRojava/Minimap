[workspace]
resolver = "2"
members = ["crates/minimap-types", "crates/minimap-core", "crates/minimap-store", "src-tauri", "ui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
minimap-types = { path = "crates/minimap-types" }
minimap-core = { path = "crates/minimap-core" }
minimap-store = { path = "crates/minimap-store" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
anyhow = "1.0.104"
uuid = { version = "1.26.1", features = ["serde"] }
time = { version = "0.3.55", features = ["serde", "serde-human-readable", "serde-well-known", "formatting", "parsing", "macros"] }
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher-vendored-openssl", "backup", "functions"] }
rusqlite_migration = "2.6.0"
petgraph = "0.8.3"
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
proptest = "1.11.0"
insta = "1.48.0"

tauri = { version = "2.12.1", features = [] }
tauri-build = "2.7.1"
tauri-plugin-dialog = "2.8.1"
leptos = { version = "0.8.21", features = ["csr"] }
leptos_router = "0.8.16"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
serde-wasm-bindgen = "0.6.5"
js-sys = "0.3.106"
web-sys = { version = "0.3.106", features = ["CssStyleDeclaration", "DomRect", "HtmlTextAreaElement", "Location", "DataTransfer", "DragEvent", "MediaQueryList", "MediaQueryListEvent", "Storage"] }
console_error_panic_hook = "0.1.7"

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
panic = "abort"
