<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Minimap</title>
  <!-- Follows the system colour scheme: the light tile by default, the dark one when the system is
       dark. Brand asset: it keeps its own colours and gradients. -->
  <style>
    .bg0 { stop-color: #FBF8F0; }
    .bg1 { stop-color: #E9E3D4; }
    .fog { stop-color: #0B1524; stop-opacity: 0; }
    .grid { stroke: #16293F; stroke-opacity: 0.06; }
    .link { stroke: #17877A; stroke-opacity: 0.5; }
    .node { fill: #17877A; fill-opacity: 0.5; }
    .frame { stroke: #16293F; fill: #16293F; fill-opacity: 0.05; }
    .halo { fill: #17877A; fill-opacity: 0.18; }
    .here { fill: #17877A; }
    @media (prefers-color-scheme: dark) {
      .bg0 { stop-color: #16293F; }
      .bg1 { stop-color: #0B1524; }
      .fog { stop-opacity: 0.85; }
      .grid { stroke: #FFFFFF; stroke-opacity: 0.06; }
      .link { stroke: #3FC7B8; stroke-opacity: 0.55; }
      .node { fill: #3FC7B8; fill-opacity: 0.55; }
      .frame { stroke: #F7F4EC; fill: #FFFFFF; fill-opacity: 0.07; }
      .halo { fill: #3FC7B8; fill-opacity: 0.2; }
      .here { fill: #3FC7B8; }
    }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" class="bg0"/>
      <stop offset="1" class="bg1"/>
    </linearGradient>
    <radialGradient id="fog" cx="0.5" cy="0.5" r="0.72">
      <stop offset="0.55" class="fog" style="stop-opacity:0"/>
      <stop offset="1" class="fog"/>
    </radialGradient>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <g clip-path="url(#tile)">
    <g class="grid" stroke-width="3">
      <path d="M64 0V512M128 0V512M192 0V512M256 0V512M320 0V512M384 0V512M448 0V512"/>
      <path d="M0 64H512M0 128H512M0 192H512M0 256H512M0 320H512M0 384H512M0 448H512"/>
    </g>
    <path class="link" d="M104 392 L292 300 L408 140" fill="none" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <rect class="frame" x="148" y="196" width="200" height="152" rx="22" stroke-width="14"/>
    <g class="node"><circle cx="104" cy="392" r="24"/><circle cx="408" cy="140" r="24"/></g>
    <circle class="halo" cx="292" cy="300" r="62"/>
    <circle class="here" cx="292" cy="300" r="36"/>
    <rect width="512" height="512" fill="url(#fog)"/>
  </g>
</svg>
