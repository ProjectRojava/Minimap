<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Minimap – Dark</title>
  <!-- A minimap: a map line, the viewport box a game minimap draws to show what is on screen, and
       you (the solid node) inside it. Brand asset: it keeps its own colours and gradients. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16293F"/>
      <stop offset="1" stop-color="#0B1524"/>
    </linearGradient>
    <radialGradient id="fog" cx="0.5" cy="0.5" r="0.72">
      <stop offset="0.55" stop-color="#0B1524" stop-opacity="0"/>
      <stop offset="1" stop-color="#0B1524" stop-opacity="0.85"/>
    </radialGradient>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <g clip-path="url(#tile)">
    <g stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="3">
      <path d="M64 0V512M128 0V512M192 0V512M256 0V512M320 0V512M384 0V512M448 0V512"/>
      <path d="M0 64H512M0 128H512M0 192H512M0 256H512M0 320H512M0 384H512M0 448H512"/>
    </g>
    <path d="M104 392 L292 300 L408 140" fill="none" stroke="#3FC7B8" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.55"/>
    <rect x="148" y="196" width="200" height="152" rx="22" fill="#FFFFFF" fill-opacity="0.07" stroke="#F7F4EC" stroke-width="14"/>
    <g fill="#3FC7B8" fill-opacity="0.55"><circle cx="104" cy="392" r="24"/><circle cx="408" cy="140" r="24"/></g>
    <circle cx="292" cy="300" r="62" fill="#3FC7B8" fill-opacity="0.2"/>
    <circle cx="292" cy="300" r="36" fill="#3FC7B8"/>
    <rect width="512" height="512" fill="url(#fog)"/>
  </g>
</svg>
