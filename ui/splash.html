<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>Minimap</title>
    <!-- The splash screen's own small window (docs/product-design/13-splash-screen.md): the shell
         opens it at once, keeps the main window hidden while the app downloads and starts, and
         closes it when the app is ready (`src-tauri/src/commands/splash.rs`). Plain HTML and CSS,
         no script, so it paints at once and follows the security policy.

         Two looks, one for each kind of theme: DARK is the brand's night map (navy, the teal route,
         a cream viewport frame, a fog vignette) and LIGHT is its paper map (cream, navy ink, deep
         teal). The shell picks the one that matches the app's chosen theme (the app tells it
         which kind each time the theme is applied) by opening this page as `#force-light` or
         `#force-dark`; with no word yet, or with the app following the system, the system's own
         colour scheme decides.
         Each has its own background (a grid, a small network of nodes, the corners of a viewport)
         and its own mark (`branding/minimap-logo-dark.svg`, `branding/minimap-logo-light.svg`).
         The words and the version are the same in both; a test checks the version and the author
         against the About page. -->
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0B1524; }
      #splash {
        position: fixed; inset: 0; box-sizing: border-box; overflow: hidden;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 14px; color: #F7F4EC; background: #0B1524;
        border: 1px solid rgba(247, 244, 236, 0.14);
        font-family: "Inter", "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        user-select: none; cursor: default;
      }
      #splash .scene { position: absolute; inset: 0; }
      #splash .scene svg { display: block; width: 100%; height: 100%; }
      #splash .scene-light, #splash .mark-light { display: none; }
      #splash .content { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 14px; width: 100%; }
      #splash .mark svg { width: min(112px, 34vmin); height: auto; display: block; }
      #splash .mark-dark svg { filter: drop-shadow(0 8px 22px rgba(63, 199, 184, 0.32)); }
      #splash .splash-name { font-size: 15px; font-weight: 600; letter-spacing: 0.04em; color: #F7F4EC; }
      #splash .splash-note { position: relative; height: 34px; width: 100%; box-sizing: border-box; padding: 0 16px; font-size: 12px; line-height: 16px; color: #9FB3C8; text-align: center; }
      #splash .splash-note span { position: absolute; left: 16px; right: 16px; opacity: 0; animation-fill-mode: forwards; }
      #splash .splash-start { animation: splash-in 400ms ease-out 700ms forwards, splash-away 300ms ease-out 9s forwards; }
      #splash .splash-slow { animation: splash-in 400ms ease-out 9.3s forwards; }
      #splash .splash-meta { position: absolute; z-index: 1; left: 16px; right: 16px; bottom: 16px; text-align: center; font-size: 11px; line-height: 16px; color: #7388A0; opacity: 0; animation: splash-in 500ms ease-out 400ms forwards; }
      #splash .splash-meta .splash-version { color: #9FB3C8; font-variant-numeric: tabular-nums; }
      /* The viewport box draws itself in, then "you" pulses once; the network breathes softly. */
      #splash .splash-box { stroke-dasharray: 1; stroke-dashoffset: 1; animation: splash-draw 700ms ease-out 150ms forwards; }
      #splash .splash-halo { transform-origin: 292px 300px; animation: splash-pulse 1400ms ease-in-out 800ms 2; }
      #splash .net-node { animation: net-breathe 3.2s ease-in-out infinite; }
      #splash .net-node:nth-child(2n) { animation-delay: -1.1s; }
      #splash .net-node:nth-child(3n) { animation-delay: -2.2s; }
      @keyframes splash-draw { to { stroke-dashoffset: 0; } }
      @keyframes splash-pulse { 0%, 100% { transform: scale(1); opacity: 0.2; } 50% { transform: scale(1.35); opacity: 0.4; } }
      @keyframes splash-in { to { opacity: 1; } }
      @keyframes splash-away { to { opacity: 0; } }
      @keyframes net-breathe { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

      /* LIGHT: the paper map. It shows when the app's theme is a light one (the shell opens this
         page as `splash.html#force-light`), and, when the shell doesn't know the theme yet (first
         start) or the app follows the system, when the system is light. `#force-dark` keeps the
         dark look on a light system. The two blocks are the same rules under two conditions. */
      @media (prefers-color-scheme: light) {
        html:not(:has(#force-dark:target)), html:not(:has(#force-dark:target)) body { background: #FBF8F0; }
        html:not(:has(#force-dark:target)) #splash { color: #16293F; background: #FBF8F0; border-color: rgba(22, 41, 63, 0.18); }
        html:not(:has(#force-dark:target)) #splash .scene-dark, html:not(:has(#force-dark:target)) #splash .mark-dark { display: none; }
        html:not(:has(#force-dark:target)) #splash .scene-light, html:not(:has(#force-dark:target)) #splash .mark-light { display: block; }
        html:not(:has(#force-dark:target)) #splash .mark-light svg { filter: drop-shadow(0 8px 18px rgba(22, 41, 63, 0.2)); }
        html:not(:has(#force-dark:target)) #splash .splash-name { color: #16293F; }
        html:not(:has(#force-dark:target)) #splash .splash-note { color: #4A5D73; }
        html:not(:has(#force-dark:target)) #splash .splash-meta { color: #7B8898; }
        html:not(:has(#force-dark:target)) #splash .splash-meta .splash-version { color: #4A5D73; }
      }
      html:has(#force-light:target), html:has(#force-light:target) body { background: #FBF8F0; }
      html:has(#force-light:target) #splash { color: #16293F; background: #FBF8F0; border-color: rgba(22, 41, 63, 0.18); }
      html:has(#force-light:target) #splash .scene-dark, html:has(#force-light:target) #splash .mark-dark { display: none; }
      html:has(#force-light:target) #splash .scene-light, html:has(#force-light:target) #splash .mark-light { display: block; }
      html:has(#force-light:target) #splash .mark-light svg { filter: drop-shadow(0 8px 18px rgba(22, 41, 63, 0.2)); }
      html:has(#force-light:target) #splash .splash-name { color: #16293F; }
      html:has(#force-light:target) #splash .splash-note { color: #4A5D73; }
      html:has(#force-light:target) #splash .splash-meta { color: #7B8898; }
      html:has(#force-light:target) #splash .splash-meta .splash-version { color: #4A5D73; }
      @media (prefers-reduced-motion: reduce) {
        #splash .splash-box { animation: none; stroke-dashoffset: 0; }
        #splash .splash-meta { animation: splash-in 1ms 400ms forwards; }
        #splash .splash-halo, #splash .net-node { animation: none; }
        #splash .splash-start { animation: splash-in 1ms 700ms forwards, splash-away 1ms 9s forwards; }
        #splash .splash-slow { animation: splash-in 1ms 9s forwards; }
      }
    </style>
  </head>
  <body>
    <!-- Targets for the shell's `#force-light` / `#force-dark` (the app's theme), see the CSS. -->
    <span id="force-light"></span><span id="force-dark"></span>
    <div id="splash" role="status" aria-live="polite">

      <!-- DARK background: night navy, a fine grid, the teal route as a small network, the corners
           of a viewport, a glow behind the mark and a fog vignette at the edges. -->
      <div class="scene scene-dark" aria-hidden="true">
        <svg viewBox="0 0 440 340" preserveAspectRatio="xMidYMid slice">
          <defs>
            <linearGradient id="sd-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#16293F"/><stop offset="1" stop-color="#0B1524"/></linearGradient>
            <radialGradient id="sd-glow" cx="0.5" cy="0.4" r="0.5"><stop offset="0" stop-color="#3FC7B8" stop-opacity="0.26"/><stop offset="1" stop-color="#3FC7B8" stop-opacity="0"/></radialGradient>
            <radialGradient id="sd-fog" cx="0.5" cy="0.5" r="0.78"><stop offset="0.5" stop-color="#050B14" stop-opacity="0"/><stop offset="1" stop-color="#050B14" stop-opacity="0.8"/></radialGradient>
            <pattern id="sd-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.055" stroke-width="1"/></pattern>
          </defs>
          <rect width="440" height="340" fill="url(#sd-bg)"/>
          <rect width="440" height="340" fill="url(#sd-grid)"/>
          <rect width="440" height="340" fill="url(#sd-glow)"/>
          <!-- the corners of a viewport, and its faint outline -->
          <rect x="52" y="40" width="336" height="260" rx="16" fill="none" stroke="#F7F4EC" stroke-opacity="0.07" stroke-dasharray="2 7"/>
          <g fill="none" stroke="#3FC7B8" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round">
            <path d="M52 62V56a16 16 0 0 1 16-16h6"/><path d="M388 62V56a16 16 0 0 0-16-16h-6"/>
            <path d="M52 278v6a16 16 0 0 0 16 16h6"/><path d="M388 278v6a16 16 0 0 1-16 16h-6"/>
          </g>
          <!-- the network: linked nodes at the edges, away from the words -->
          <g fill="none" stroke="#3FC7B8" stroke-opacity="0.26" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M30 292 88 262 58 206 26 150 92 120 40 58"/><path d="M58 206 92 120"/>
            <path d="M410 46 356 84 402 138 372 200 414 262 350 300"/><path d="M356 84 372 200"/>
          </g>
          <g fill="#3FC7B8">
            <circle class="net-node" cx="30" cy="292" r="3.5" fill-opacity="0.6"/><circle class="net-node" cx="88" cy="262" r="3" fill-opacity="0.5"/>
            <circle class="net-node" cx="58" cy="206" r="4.5" fill-opacity="0.65"/><circle class="net-node" cx="26" cy="150" r="3" fill-opacity="0.5"/>
            <circle class="net-node" cx="92" cy="120" r="3.5" fill-opacity="0.6"/><circle class="net-node" cx="40" cy="58" r="3" fill-opacity="0.5"/>
            <circle class="net-node" cx="410" cy="46" r="3.5" fill-opacity="0.6"/><circle class="net-node" cx="356" cy="84" r="4.5" fill-opacity="0.65"/>
            <circle class="net-node" cx="402" cy="138" r="3" fill-opacity="0.5"/><circle class="net-node" cx="372" cy="200" r="3.5" fill-opacity="0.6"/>
            <circle class="net-node" cx="414" cy="262" r="3" fill-opacity="0.5"/><circle class="net-node" cx="350" cy="300" r="3.5" fill-opacity="0.6"/>
          </g>
          <rect width="440" height="340" fill="url(#sd-fog)"/>
        </svg>
      </div>

      <!-- LIGHT background: warm paper, ink-blue grid, the same network in deep teal, a soft
           teal wash behind the mark. No fog: the light map is clear. -->
      <div class="scene scene-light" aria-hidden="true">
        <svg viewBox="0 0 440 340" preserveAspectRatio="xMidYMid slice">
          <defs>
            <linearGradient id="sl-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FBF8F0"/><stop offset="1" stop-color="#E9E3D4"/></linearGradient>
            <radialGradient id="sl-glow" cx="0.5" cy="0.4" r="0.5"><stop offset="0" stop-color="#17877A" stop-opacity="0.16"/><stop offset="1" stop-color="#17877A" stop-opacity="0"/></radialGradient>
            <pattern id="sl-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16293F" stroke-opacity="0.07" stroke-width="1"/></pattern>
          </defs>
          <rect width="440" height="340" fill="url(#sl-bg)"/>
          <rect width="440" height="340" fill="url(#sl-grid)"/>
          <rect width="440" height="340" fill="url(#sl-glow)"/>
          <rect x="52" y="40" width="336" height="260" rx="16" fill="none" stroke="#16293F" stroke-opacity="0.12" stroke-dasharray="2 7"/>
          <g fill="none" stroke="#17877A" stroke-opacity="0.7" stroke-width="2" stroke-linecap="round">
            <path d="M52 62V56a16 16 0 0 1 16-16h6"/><path d="M388 62V56a16 16 0 0 0-16-16h-6"/>
            <path d="M52 278v6a16 16 0 0 0 16 16h6"/><path d="M388 278v6a16 16 0 0 1-16 16h-6"/>
          </g>
          <g fill="none" stroke="#17877A" stroke-opacity="0.34" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M30 292 88 262 58 206 26 150 92 120 40 58"/><path d="M58 206 92 120"/>
            <path d="M410 46 356 84 402 138 372 200 414 262 350 300"/><path d="M356 84 372 200"/>
          </g>
          <g fill="#17877A">
            <circle class="net-node" cx="30" cy="292" r="3.5" fill-opacity="0.65"/><circle class="net-node" cx="88" cy="262" r="3" fill-opacity="0.55"/>
            <circle class="net-node" cx="58" cy="206" r="4.5" fill-opacity="0.7"/><circle class="net-node" cx="26" cy="150" r="3" fill-opacity="0.55"/>
            <circle class="net-node" cx="92" cy="120" r="3.5" fill-opacity="0.65"/><circle class="net-node" cx="40" cy="58" r="3" fill-opacity="0.55"/>
            <circle class="net-node" cx="410" cy="46" r="3.5" fill-opacity="0.65"/><circle class="net-node" cx="356" cy="84" r="4.5" fill-opacity="0.7"/>
            <circle class="net-node" cx="402" cy="138" r="3" fill-opacity="0.55"/><circle class="net-node" cx="372" cy="200" r="3.5" fill-opacity="0.65"/>
            <circle class="net-node" cx="414" cy="262" r="3" fill-opacity="0.55"/><circle class="net-node" cx="350" cy="300" r="3.5" fill-opacity="0.65"/>
          </g>
        </svg>
      </div>

      <div class="content">
        <!-- The mark: the dark logo (branding/minimap-logo-dark.svg) ... -->
        <div class="mark mark-dark">
          <svg viewBox="0 0 512 512" aria-hidden="true">
            <defs>
              <linearGradient id="sp-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#16293F"/><stop offset="1" stop-color="#0B1524"/></linearGradient>
              <radialGradient id="sp-fog" cx="0.5" cy="0.5" r="0.72"><stop offset="0.55" stop-color="#0B1524" stop-opacity="0"/><stop offset="1" stop-color="#0B1524" stop-opacity="0.85"/></radialGradient>
              <clipPath id="sp-tile"><rect width="512" height="512" rx="112"/></clipPath>
            </defs>
            <rect width="512" height="512" rx="112" fill="url(#sp-bg)"/>
            <g clip-path="url(#sp-tile)">
              <g stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="3">
                <path d="M64 0V512M128 0V512M192 0V512M256 0V512M320 0V512M384 0V512M448 0V512"/>
                <path d="M0 64H512M0 128H512M0 192H512M0 256H512M0 320H512M0 384H512M0 448H512"/>
              </g>
              <path d="M104 392 L292 300 L408 140" fill="none" stroke="#3FC7B8" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.55"/>
              <rect class="splash-box" pathLength="1" x="148" y="196" width="200" height="152" rx="22" fill="#FFFFFF" fill-opacity="0.07" stroke="#F7F4EC" stroke-width="14"/>
              <g fill="#3FC7B8" fill-opacity="0.55"><circle cx="104" cy="392" r="24"/><circle cx="408" cy="140" r="24"/></g>
              <circle class="splash-halo" cx="292" cy="300" r="62" fill="#3FC7B8" fill-opacity="0.2"/>
              <circle cx="292" cy="300" r="36" fill="#3FC7B8"/>
              <rect width="512" height="512" fill="url(#sp-fog)"/>
            </g>
            <rect x="1" y="1" width="510" height="510" rx="111" fill="none" stroke="#F7F4EC" stroke-opacity="0.14" stroke-width="2"/>
          </svg>
        </div>
        <!-- ... and the light logo (branding/minimap-logo-light.svg). -->
        <div class="mark mark-light">
          <svg viewBox="0 0 512 512" aria-hidden="true">
            <defs>
              <linearGradient id="sp-lbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FBF8F0"/><stop offset="1" stop-color="#E9E3D4"/></linearGradient>
              <clipPath id="sp-ltile"><rect width="512" height="512" rx="112"/></clipPath>
            </defs>
            <rect width="512" height="512" rx="112" fill="url(#sp-lbg)"/>
            <g clip-path="url(#sp-ltile)">
              <g stroke="#16293F" stroke-opacity="0.06" stroke-width="3">
                <path d="M64 0V512M128 0V512M192 0V512M256 0V512M320 0V512M384 0V512M448 0V512"/>
                <path d="M0 64H512M0 128H512M0 192H512M0 256H512M0 320H512M0 384H512M0 448H512"/>
              </g>
              <path d="M104 392 L292 300 L408 140" fill="none" stroke="#17877A" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.5"/>
              <rect class="splash-box" pathLength="1" x="148" y="196" width="200" height="152" rx="22" fill="#16293F" fill-opacity="0.05" stroke="#16293F" stroke-width="14"/>
              <g fill="#17877A" fill-opacity="0.5"><circle cx="104" cy="392" r="24"/><circle cx="408" cy="140" r="24"/></g>
              <circle class="splash-halo" cx="292" cy="300" r="62" fill="#17877A" fill-opacity="0.18"/>
              <circle cx="292" cy="300" r="36" fill="#17877A"/>
            </g>
            <rect x="1" y="1" width="510" height="510" rx="111" fill="none" stroke="#16293F" stroke-opacity="0.16" stroke-width="2"/>
          </svg>
        </div>
        <div class="splash-name">Minimap</div>
        <div class="splash-note">
          <span class="splash-start">Starting up</span>
          <span class="splash-slow">Still starting. This can take a moment after an update.</span>
        </div>
      </div>

      <div class="splash-meta">
        <div class="splash-version">Version 0.6.0</div>
        <div>Uditt Lamba · uditt.lamba@pm.me</div>
      </div>
    </div>
  </body>
</html>
