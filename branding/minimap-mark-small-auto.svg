<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>Minimap – small mark</title>
  <!-- The small mark following the system colour scheme (the favicon). Brand asset. -->
  <style>
    .tile { fill: #F1ECDF; } .line { stroke: #17877A; stroke-opacity: 0.6; } .dot { fill: #17877A; }
    .box { stroke: #16293F; } .you { fill: #17877A; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #12233A; } .line { stroke: #3FC7B8; } .dot { fill: #3FC7B8; fill-opacity: 0.6; }
      .box { stroke: #F7F4EC; } .you { fill: #3FC7B8; }
    }
    .dot { fill-opacity: 0.6; }
  </style>
  <rect class="tile" width="32" height="32" rx="7"/>
  <path class="line" d="M4.5 26.5 L17 17.5 L27.5 5.5" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="box" x="8" y="10.5" width="14" height="11" rx="2" fill="none" stroke-width="2"/>
  <g class="dot"><circle cx="4.5" cy="26.5" r="2"/><circle cx="27.5" cy="5.5" r="2"/></g>
  <circle class="you" cx="17" cy="17.5" r="3.4"/>
</svg>
